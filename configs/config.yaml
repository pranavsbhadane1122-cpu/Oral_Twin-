paths:
  raw: data/raw
  processed: data/processed
  longitudinal: data/longitudinal
  models: models

classification:
  img_size: 224
  batch_size: 32
  epochs: 30
  # 3-class mode until the external "healthy" dataset arrives (access requested);
  # restore to [healthy, caries, calculus, gingivitis] and rerun once available.
  classes: [caries, calculus, gingivitis]
  learning_rate: 0.001
  fine_tune_lr: 0.0001
  fine_tune_layers: 30
  early_stop_patience: 5
  dropout: 0.3
  augment:
    rotation_deg: 10
    zoom: 0.1
    brightness: 0.1
    contrast: 0.1

segmentation:
  img_size: 256
  batch_size: 16
  epochs: 50

split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

dedup:
  phash_size: 8          # perceptual hash grid (8 -> 64-bit hash)
  phash_threshold: 8     # Hamming distance <= threshold counts as near-duplicate (conservative)
  cluster_margin: 4      # clustering uses threshold+margin so borderline pairs never straddle splits

opmd:
  img_size: 224
  classes: [suspicious, normal]

explain:
  # "auto" resolves to the last 4-D (spatial) layer of the MobileNetV2 base at
  # runtime; on the current model that is out_relu (7x7x1280), the standard
  # Grad-CAM target. Pin an explicit layer name here only to override.
  gradcam_layer: auto
  overlay_alpha: 0.4
  colormap: jet
  diverging_colormap: bwr      # change-CAM: red = more attention, blue = less
  flat_cam_std_eps: 0.01       # heatmap std below this = flat = uninformative

risk:
  # rule-based bands; no learned risk model, no personal prediction
  growth_moderate_pct: 10.0    # notable growth on a comparable lesion
  growth_elevated_pct: 30.0    # substantial growth
  condition_prob_high: 0.70    # classifier confidence for a "confident" condition
  persistent_conditions: [gingivitis, calculus]
  escalate_on_rule_count: 2    # two or more Moderate-level rules -> Elevated

delta:
  min_lesion_area_px: 100      # connected components smaller than this are noise
  change_area_thresh: 0.10     # >=10% area change is "notable"
  compactness_change_thresh: 0.15  # relative change in perimeter^2/(4*pi*area)
  confidence_floor: 0.3        # below this alignment confidence, refuse to compare
  match_iou_thresh: 0.10       # IoU above which two components are the same lesion
  # colour is measured RELATIVE to a ring of surrounding tissue in the same
  # image, so a global lighting/white-balance shift between visits cancels out
  color_ring_px: 12            # ring thickness around the lesion
  color_ring_min_px: 60        # smaller ring than this -> colour "not measurable"
  # calibrated by scripts/calibrate_color_thresh.py: p95 of the relative-colour
  # magnitude over 97 no-change lesions was 27.47, rounded up -> 4.1% flagged
  relative_color_thresh: 28.0
  # a lesion nearer than this to the edge of the two photos' overlap is only
  # partly visible in the newer photo, so its area cannot be compared fairly
  edge_margin_px: 3
  reliability_high: 0.7        # confidence at/above this is "high"
  reliability_moderate: 0.5    # at/above this "moderate", below it "low"
  synthetic:
    # base lesion drawn for pairs whose ground truth injected no lesion change,
    # so "no change" pairs still exercise the false-change path
    base_radius_frac: [0.07, 0.13]
    edge_noise_amplitude: 0.12  # radial jitter, so masks are not perfect circles
    edge_noise_harmonics: 5

alignment:
  detector: orb
  n_features: 4000
  ratio_test: 0.75
  ransac_reproj_thresh: 4.0
  min_inliers: 15
  clahe_clip: 2.0
  clahe_grid: 8
  mask_min_area_frac: 0.10   # fall back to full image if mouth mask is smaller
  # homography plausibility limits (H normalized to h33=1, mapping visit2->visit1)
  min_scale: 0.5             # sqrt(|det| of the 2x2 affine part)
  max_scale: 2.0
  max_perspective: 0.002     # |h31|, |h32| beyond this = implausible tilt
  min_abs_det: 1.0e-6        # near-singular rejection
  confidence:
    w_inlier_ratio: 0.35     # weights sum to 1
    w_inliers: 0.20
    w_reproj: 0.30
    w_blur: 0.15
    inliers_saturation: 60   # n_inliers at which that term maxes out
    reproj_halflife: 2.0     # px; reproj term = exp(-err/halflife)
    blur_saturation: 150.0   # variance-of-Laplacian at which blur term maxes out

longitudinal:
  n_pairs: 200
  source_split: test     # pairs are built ONLY from test-split images
  max_rotation_deg: 15
  scale_range: [0.85, 1.15]
  max_shift_frac: 0.05           # crop shift as fraction of image size
  perspective_jitter_frac: 0.03  # corner jitter for the random homography
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  color_temp_jitter: 0.08
  max_blur_sigma: 1.2
  lesion_change_prob: 0.5
  lesion_radius_frac: [0.06, 0.14]   # lesion radius as fraction of min(h, w)
  lesion_darken_range: [0.75, 0.92]  # multiplicative darkening inside lesion
  lesion_enlarge_range: [1.1, 1.35]  # local enlargement factor
